# Configuração do analisador estático. Ver plan.md (Structure Decision) para o
# porquê da regra de fronteira do domínio.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
    dead_code: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_pub_dependencies
    - unawaited_futures
    - use_super_parameters

# NOTA: a proibição de importar Flutter/Flame dentro de lib/domain/ não é
# expressável como lint do analyzer. Ela é verificada por
# test/domain/architecture_test.dart, que falha se qualquer arquivo do domínio
# importar package:flutter, package:flame, dart:ui ou um plugin de plataforma.
