# Heap do daemon do Gradle.
#
# Era -Xmx8G -XX:MaxMetaspaceSize=4G, o valor do template do Flutter, e ele
# impede o build de começar em qualquer máquina sem 8 GB livres: o G1 dimensiona
# a pilha de marcação pelo heap máximo e tenta reservá-la na inicialização da VM,
# então o erro não é "faltou memória ao compilar" — é
# "Failed to allocate initial concurrent mark overflow mark stack", antes da
# primeira tarefa.
#
# 2 GB compilam este projeto com folga. Subir daqui só faz sentido se um build
# real falhar por OutOfMemory, e aí o dump de -XX:+HeapDumpOnOutOfMemoryError diz
# quanto pedir.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
